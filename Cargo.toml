[workspace]
resolver = "3"
members = ["app/rust"]

[package]
name = "localpost"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1", features = ["backtrace"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
nio = { git = "https://github.com/nurmohammed840/nio", version = "0.2.0-rc.2" }
lipi = { git = "https://github.com/nurmohammed840/setu" }
local-ip-address = "0.6"
futures = { version = "0.3", features = ["write-all-vectored"] }
yamux = "0.14"
fastrand = "2"
flume = "0.12"
# log = "0.4"
# dirs = "7"
