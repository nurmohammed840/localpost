[package]
name = "rust_lib_localpost"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
localpost = { path = "../../" }
send_wrapper = "0.6"
derive_more = { version = "2", features = ["from"] }
flutter_rust_bridge = { version = "=2.13.0", default-features = false, features = [
    "anyhow",
    "dart-opaque",
    # "log",
    # "portable-atomic",
    "rust-async",
    "thread-pool",
    # "user-utils",
    # "wasm-start",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
