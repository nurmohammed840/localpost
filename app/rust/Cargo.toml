[package]
name = "rust_lib_localpost"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
localpost = { path = "../../" }
send_wrapper = "0.6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
local-ip-address = "0.6"
flutter_rust_bridge = { version = "=2.13.0", default-features = false, features = [
    "anyhow",
    "dart-opaque",
    "rust-async",
    "thread-pool",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
